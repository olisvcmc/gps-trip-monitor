name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 36 & Build Tools (dibutuhkan cordova-android 15)
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" --sdk_root="$ANDROID_HOME" || yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Tambahkan platform Android
        run: cordova platform add android@15.1.0

      - name: Build APK (debug, tidak perlu signing)
        run: cordova build android --debug

      - name: Cari lokasi APK
        id: findapk
        run: |
          APK_PATH=$(find platforms/android -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: gps-trip-monitor-apk
          path: ${{ steps.findapk.outputs.path }}
